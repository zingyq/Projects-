<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablica Zadań</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="app-window">
        <section class="left-panel">
            <form id="task-form">
                <fieldset class="field">
                    <label for="title">Tytuł *</label>
                    <input id="title" name="title" type="text" placeholder="Wpisz tytuł..." required>
                </fieldset>
                <fieldset class="field">
                    <label for="description">Opis</label>
                    <textarea id="description" name="description" rows="3" placeholder="Wpisz opis..."></textarea>
                </fieldset>
                <fieldset class="field">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="todo">Do zrobienia</option>
                        <option value="in_progress">W trakcie</option>
                        <option value="done">Zakończone</option>
                    </select>
                </fieldset>

                <button type="submit" class="btn-add">
                    <span class="plus-icon">+</span> DODAJ
                </button>
            </form>
        </section>
        <section class="right-panel">
            <p id="message" class="message" role="status" aria-live="polite"></p>

            <section class="board-columns">
                <article class="board-column">
                    <h2 class="column-title">Do zrobienia</h2>
                    <ul class="task-list" id="list-todo"></ul>
                </article>
                <article class="board-column">
                    <h2 class="column-title">W trakcie</h2>
                    <ul class="task-list" id="list-in-progress"></ul>
                </article>
                <article class="board-column">
                    <h2 class="column-title">Zakończone</h2>
                    <ul class="task-list" id="list-done"></ul>
                </article>
            </section>

            <footer class="time-widget">
                <span id="current-time"></span>
                <span id="current-date"></span>
                <a href="login.html" class="btn-login-small">Login</a>
            </footer>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
